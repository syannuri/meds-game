# Menerbitkan game (app/www) ke GitHub Pages setiap ada perubahan di main.
# Alamat: https://syannuri.github.io/meds-game/
name: Terbitkan ke GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/www/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Unggah dan deploy dipisah menjadi dua job (seperti template resmi GitHub Pages):
  # deploy baru berjalan setelah job build selesai, sehingga artefak sudah tercatat
  # (satu job berurutan kadang gagal dengan "Found 0 artifact(s)").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
